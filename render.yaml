services:
  - type: web
    name: monte-hilo
    runtime: python
    plan: free
    rootDir: Proyecto_Tienda_Online
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: monte-hilo-postgres
          property: connectionString

databases:
  - name: monte-hilo-postgres
    databaseName: monte_hilo
    user: monte_hilo_user
    plan: free