<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}Ferretería El Constructor{% endblock %}</title>
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- CSS propio -->
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	{% block head %}{% endblock %}
</head>
<body>
	<header class="header-principal py-3 bg-light">
		<div class="container">
			<div class="d-flex justify-content-between align-items-center">
				<div>
					<h1 class="h4 mb-0">🔨 Ferretería El Constructor</h1>
					<small class="text-muted">Soluciones para tus proyectos</small>
				</div>
				<nav>
					<a class="btn btn-outline-primary btn-sm me-2" href="{{ url_for('index') }}">Inicio</a>
					<a class="btn btn-outline-primary btn-sm me-2" href="{{ url_for('productos') }}">Productos</a>
					<a class="btn btn-outline-primary btn-sm me-2" href="{{ url_for('clientes') }}">Clientes</a>
					<a class="btn btn-outline-primary btn-sm me-2" href="{{ url_for('proveedores') }}">Proveedores</a>
					<a class="btn btn-outline-primary btn-sm" href="{{ url_for('facturacion') }}">Facturación</a>
				</nav>
			</div>
		</div>
	</header>

	<main class="container my-4">
		{% block content %}{% endblock %}
	</main>

	<footer class="footer-principal mt-5 py-4">
		<div class="container text-center text-white">
			<small>© 2026 Ferretería El Constructor</small>
		</div>
	</footer>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="{{ url_for('static', filename='js/script.js') }}"></script>
	{% block scripts %}{% endblock %}
</body>
</html>
