<header class="header-principal py-3 bg-light">
	<div class="container">
		<div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
			<div>
				<h1 class="h4 mb-0">🔨 {{ nombre_sistema }}</h1>
				<small class="text-muted">Soluciones para tus proyectos</small>
			</div>
			<nav class="d-flex flex-wrap gap-2 align-items-center">
				<a class="btn btn-outline-primary btn-sm" href="{{ url_for('index') }}">Inicio</a>
				{% if current_user.is_authenticated %}
				<a class="btn btn-outline-primary btn-sm" href="{{ url_for('productos') }}">Productos</a>
				<a class="btn btn-outline-primary btn-sm" href="{{ url_for('clientes') }}">Clientes</a>
				<a class="btn btn-outline-primary btn-sm" href="{{ url_for('proveedores') }}">Proveedores</a>
				<a class="btn btn-outline-primary btn-sm" href="{{ url_for('facturacion') }}">Facturación</a>
				<span class="badge text-bg-secondary">Usuario: {{ current_user.usuario }}</span>
				<a class="btn btn-outline-danger btn-sm" href="{{ url_for('logout') }}">Cerrar sesión</a>
				{% else %}
				<a class="btn btn-outline-success btn-sm" href="{{ url_for('login') }}">Iniciar sesión</a>
				<a class="btn btn-outline-secondary btn-sm" href="{{ url_for('registro') }}">Registrarse</a>
				{% endif %}
			</nav>
		</div>
	</div>
</header>
